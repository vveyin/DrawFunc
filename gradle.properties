# Gradle JVM 参数。
# debug 构建 2G 足够，但 **R8（assembleRelease）会在这台机器上把 2G 的 daemon 撑崩**
# （"Gradle build daemon disappeared unexpectedly"）—— 全量混淆 + 资源压缩的
# 峰值内存明显更高。这里直接给 4G，debug 构建也用同一份配置，省得来回改。
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m

# 本机沙箱里 Gradle 的文件监视器起不来
# （NativeException: Couldn't open current thread），必须关掉。
org.gradle.vfs.watch=false

# AGP 8 之后必须显式打开 AndroidX。
android.useAndroidX=true

# 非传递 R 类，减少合成类数量，加快编译。
android.nonTransitiveRClass=true

kotlin.code.style=official

# 单模块项目，并行没意义，反而在多 daemon 环境里更容易互相拖慢。
org.gradle.parallel=false
